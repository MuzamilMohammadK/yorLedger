name: Release (APK + desktop + web)

# Push a tag like v1.0.0 to build everything and publish a GitHub Release.
# Optional secrets for a properly signed APK (otherwise it is signed with the debug key):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0) — builds artifacts without publishing a release'
        required: true

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm test && npm run build
      - run: cd web/dist && zip -qr "$GITHUB_WORKSPACE/YorLedger-web-${VERSION#v}.zip" .
      - uses: actions/upload-artifact@v4
        with: { name: web-dist, path: web/dist }
      - uses: actions/upload-artifact@v4
        with: { name: out-web, path: 'YorLedger-web-*.zip' }

  android:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: web/dist }
      - name: Copy web build into the Android project
        run: cd web && npx cap sync android
      - name: Decode signing key (optional)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — APK is signed with the debug key."
          fi
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          V="${VERSION#v}"
          IFS=. read -r MA MI PA <<< "$V"
          CODE=$(( MA * 10000 + MI * 100 + PA ))
          cd web/android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PversionName="$V" -PversionCode="$CODE"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/YorLedger-$V.apk"
      - uses: actions/upload-artifact@v4
        with: { name: out-android, path: 'YorLedger-*.apk' }

  desktop:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: web/dist }
      - name: Build installer
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # unsigned builds (no code-signing certificate yet)
        run: |
          npm ci
          npm version "${VERSION#v}" --no-git-tag-version --allow-same-version
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: out-desktop-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.AppImage
            desktop/release/*.deb

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: 'out-*', path: out, merge-multiple: true }
      - run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          body: |
            ## Install
            - **Android**: download `YorLedger-*.apk`, open it, allow "Install unknown apps" when asked.
            - **Windows**: run `YorLedger-*-win-x64.exe`.
            - **macOS**: open the `.dmg` (Apple silicon: `arm64`, Intel: `x64`). First launch: right-click → Open.
            - **Linux**: `.AppImage` (chmod +x and run) or `.deb`.
            - **Website**: https://yorledger-fbb71.web.app
