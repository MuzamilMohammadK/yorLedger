name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Shared domain tests (tax, returns, scanning parsers)
        run: npm test
      - name: Build website
        run: npm run build

  # §19.2 / §19.3: Firestore rules tests and the end-to-end shop journey on the Firebase emulators.
  emulator-tests:
    runs-on: ubuntu-latest
    env:
      FIREBASE_TOOLS: firebase-tools@15.34.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run build --workspace=shared
      - name: Firestore security rules tests
        run: npx --yes $FIREBASE_TOOLS emulators:exec --only firestore --project demo-yorledger "node --test tests/rules/"
      - name: Build web app against the emulators
        env:
          VITE_USE_EMULATORS: 'true'
          VITE_FIREBASE_API_KEY: demo-key
          VITE_FIREBASE_AUTH_DOMAIN: demo-yorledger.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: demo-yorledger
          VITE_FIREBASE_APP_ID: '1:1:web:1'
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: End-to-end shop journey (phone + desktop)
        run: npx --yes $FIREBASE_TOOLS emulators:exec --only auth,firestore --project demo-yorledger "npx playwright test -c tests/e2e/playwright.config.ts"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screens-and-report
          path: |
            test-results/
            playwright-report/
          retention-days: 14
